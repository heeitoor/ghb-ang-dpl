  Build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - name: Transform
      shell: pwsh
      working-directory: ./dist/new-proj
      run: |
        ls
        $short_sha=$(git rev-parse --short ${{ github.sha }})
        $dist_hash=ls ./main*.js | awk -F'[.]' '{print $2}'
        "{ `"hash`": `"$dist_hash`", `"commit`": `"$short_sha`", `"commitLong`": `"${{ github.sha }}`", `"branch`": `"${{ github.ref_name }}`"}" | Out-File ./version.json
        cat ./version.json
        ls ./
        cat ./index.html
        (Get-Content -path ./index.html -Raw) -replace "</html>","<script>window.ts_hash_version='$dist_hash';window.ts_commit='$short_sha';</script>$([Environment]::NewLine)</html>" | Set-Content -Path ./index.html 
        cat ./index.html
